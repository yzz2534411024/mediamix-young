name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  # ============================================================
  # Desktop (JVM) — Build & Test
  # ============================================================
  desktop:
    name: Desktop Build & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Desktop compile
        run: ./gradlew :shared:compileKotlinDesktop :composeUi:compileKotlinDesktop :desktopApp:compileKotlinDesktop

      - name: Desktop tests
        run: ./gradlew :shared:desktopTest :composeUi:desktopTest

      - name: Package Desktop distribution
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-results
          path: |
            shared/build/reports/tests/
            composeUi/build/reports/tests/

  # ============================================================
  # Android — Build & Test
  # ============================================================
  android:
    name: Android Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android compile
        run: ./gradlew :shared:compileDebugKotlinAndroid :composeUi:compileDebugKotlinAndroid :androidApp:compileDebugKotlin

      - name: Android unit tests
        run: ./gradlew :shared:testDebugUnitTest :composeUi:testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Build Release APK (R8 + ProGuard)
        run: ./gradlew :androidApp:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: androidApp/build/outputs/apk/release/*.apk

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            shared/build/reports/tests/
            composeUi/build/reports/tests/

  # ============================================================
  # Code Quality (detekt) — runs on PRs
  # ============================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [desktop, android]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run detekt
        run: ./gradlew detekt
        continue-on-error: true

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: "**/build/reports/detekt/"
