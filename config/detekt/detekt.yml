# MediaMix KMP — detekt 配置
# 基于默认规则集，针对 KMP 项目适度放宽

build:
  maxIssues: 50
  excludeCorrectable: false

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 120        # 播放器/解析方法天然较长
  LongParameterList:
    active: true
    functionThreshold: 8  # SQLDelight DAO / 播放器参数较多
  TooManyFunctions:
    active: true
    thresholdInClasses: 30
    thresholdInInterfaces: 15
  CyclomaticComplexMethod:
    active: true
    threshold: 25
  ComplexCondition:
    active: true
    threshold: 6

naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'  # 允许 Composable 大写开头
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][A-Za-z0-9]*|[A-Z_][A-Z0-9_]*'

style:
  active: true
  MagicNumber:
    active: false           # 播放器/缓存常量多，关闭魔法数字检查
  WildcardImport:
    active: false           # Compose 常用 * 导入
  ReturnCount:
    active: true
    max: 6
  UnusedPrivateMember:
    active: true
    allowedNames: '(_|ignored|expected|serialVersionUID)'

# formatting rules require detekt-formatting plugin (not included)
# Use ktlint separately for formatting checks

empty-blocks:
  active: true
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: '_|(ignored|expected).*'

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false           # 跨平台代码常需 catch Exception
