<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Adaptive Icon 前景层（108dp 画布）。
    Android 只保证中心 66~72dp 的区域可见（其余会被圆形/方形/squircle 蒙版裁掉），
    所以猫整体缩到 0.90 并居中，留足安全边距。
  -->
  <defs>
    <linearGradient id="fur" x1="140" y1="80" x2="380" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E1ECFF"/>
    </linearGradient>
    <linearGradient id="ink" x1="190" y1="210" x2="315" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3E7EFF"/>
      <stop offset="1" stop-color="#1537B4"/>
    </linearGradient>
  </defs>

  <g transform="translate(256 256) scale(0.9) translate(-256 -262)">
    <g fill="url(#fur)" stroke="url(#fur)" stroke-width="12" stroke-linejoin="round">
      <path d="M 150 246 L 132 98 L 252 166 Z"/>
      <path d="M 362 246 L 380 98 L 260 166 Z"/>
    </g>
    <path d="M 166 226 L 152 132 L 226 172 Z" fill="#FFC4D6"/>
    <path d="M 346 226 L 360 132 L 286 172 Z" fill="#FFC4D6"/>
    <circle cx="256" cy="290" r="142" fill="url(#fur)"/>
    <ellipse cx="199" cy="240" rx="25" ry="29" fill="url(#ink)"/>
    <ellipse cx="313" cy="240" rx="25" ry="29" fill="url(#ink)"/>
    <circle cx="192" cy="230" r="8.5" fill="#FFFFFF"/>
    <circle cx="306" cy="230" r="8.5" fill="#FFFFFF"/>
    <path d="M 226 326 L 308 355 L 226 384 Z"
          fill="url(#ink)" stroke="url(#ink)" stroke-width="21" stroke-linejoin="round"/>
  </g>
</svg>
